name: Aetros Content Generation Pipeline

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Automation Script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python automation.py

      - name: Commit and Push Generated Content
        run: |
          git config --global user.name "Aetros-Bot"
          git config --global user.email "bot@aetros.com"
          git add generated_content/
          git commit -m "Automated Content Generation Update [skip ci]" || exit 0
          git push
